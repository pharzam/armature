# Continuous integration for the Armature repo itself.
#
# This is the ACTIVATED, tailored copy of docs/ci/github-actions-ci.yml. It runs
# only the jobs that apply to the kit's own repository — the discipline checks,
# which need no toolchain. The template's lint / tests / security jobs are omitted
# on purpose: Armature is domain-free and ships no product code, so there is
# nothing for them to run (the template README says to delete jobs a project does
# not need). The kit's own "tests" are the discipline checks below.
#
# The PR-title and PR-link checks live in their own workflows (pr-title.yml,
# pr-link.yml) because they run on pull-request events only.
#
# CI is the authority for the quality gate. To make these checks block a merge,
# mark them required on `main` (Settings → Branches → branch protection) — a
# repo-settings step, not a file here.

name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# Least privilege: these jobs only check out and read the repo. A read-only token
# is all they need, and it is what every step sees.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adr-lint:
    name: adr-lint (docs/adr discipline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh docs/adr/adr-lint.sh

  prd-lint:
    name: prd-lint (docs/prd discipline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh docs/prd/prd-lint.sh

  discipline-tests:
    name: discipline-tests (linter fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs each discipline linter against its good/bad fixtures. No toolchain.
      - run: sh docs/tests/run-discipline-tests.sh

  audit-record-lint:
    name: audit-record-lint (T-3v9q record)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The covering test for Definition of Done items 1-6 and 9 of
      # docs/tasks/T-3v9q.md. It runs as its own job rather than as a fifth suite
      # inside run-discipline-tests.sh because that runner is a fixture harness --
      # one case directory per assertion -- and this check is repo-wide. Its own
      # fixtures ARE run by that runner, from docs/tasks/tests/.
      - run: sh docs/tasks/audit-record-lint.sh

  agents-lint:
    name: agents-lint (root AGENTS.md and CLAUDE.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lints the root agent entry points against the documents they summarise,
      # deriving the gate steps, the rules and the shipped-check set from the
      # tree rather than holding a second copy of them. Its own job for the same
      # reason as audit-record-lint above -- the runner is a fixture harness and
      # this check is repo-wide; its fixtures ARE run there, from
      # docs/agents/tests/. Unlike audit-record-lint this check DOES apply to an
      # adopter, so it also ships in both templates under docs/ci/.
      - run: sh docs/agents/agents-lint.sh
