# PR title check — Conventional Commits (ACTIVE workflow for the Armature repo).
#
# The activated copy of docs/ci/github-actions-pr-title.yml. It enforces
# docs/engineering-discipline.md §"Commit messages" on the PR title, which becomes
# the merge commit's subject. The .githooks/commit-msg hook applies the same rule
# to every local commit.

name: PR title (conventional commits)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" must start with a
            lowercase character and must not end with a period.
