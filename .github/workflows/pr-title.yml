# PR title check — Conventional Commits (ACTIVE workflow for the Armature repo).
#
# The activated copy of docs/ci/github-actions-pr-title.yml. It checks the PR title
# follows Conventional Commits — the same <type>: <description> shape the
# .githooks/commit-msg hook checks locally — with a lowercase subject and no
# trailing period. The task ID stays in the commit subjects, and the PR links its
# issue in the body (R1), so the PR title itself carries no ID.

name: PR title (conventional commits)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" must start with a
            lowercase character and must not end with a period.
