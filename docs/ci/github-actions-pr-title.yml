# PR title check — Conventional Commits (OPTIONAL template, GitHub Actions).
#
# INERT here on purpose. To activate:
#   cp docs/ci/github-actions-pr-title.yml .github/workflows/pr-title.yml
#
# Checks the PR title follows Conventional Commits — the same <type>: <description>
# shape as docs/engineering-discipline.md §"Commit messages" — with a lowercase
# subject and no trailing period (the subjectPattern below). The task ID stays in
# the individual commit subjects, and the PR links its issue in the body (R1), so
# the PR title itself carries no ID. The .githooks/commit-msg hook checks each
# local commit. Ready as-is — no ‹…› to fill.

name: PR title (conventional commits)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" must start with a
            lowercase character and must not end with a period.
