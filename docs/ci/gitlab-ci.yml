# Continuous integration — GitLab CI (OPTIONAL template).
#
# This file is INERT here on purpose: GitLab runs the pipeline from .gitlab-ci.yml
# at the repo root. To activate it, copy it into place and fill the ‹…›:
#
#   cp docs/ci/gitlab-ci.yml .gitlab-ci.yml
#
# Then replace every ‹…› with your stack's command. CI is the AUTHORITY for the
# quality gate — protect your default branch and require the pipeline to pass
# before merge. The .githooks/ run the same rules locally for fast feedback.
# Delete any job your project does not need.
#
# See docs/engineering-discipline.md §"Continuous integration (optional)".

stages: [check]

# Run on merge requests and on the default branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

adr-lint:
  stage: check
  image: alpine:3          # any image with POSIX sh + grep/awk/sed
  script:
    - sh docs/adr/adr-lint.sh   # concrete and ready — no toolchain needed

lint:
  stage: check
  image: "‹your toolchain image›"
  script:
    - "‹lint command, e.g. a formatter --check plus a linter›"

tests:
  stage: check
  image: "‹your toolchain image›"
  script:
    - "‹test runner command›"

secrets:
  stage: check
  image: "‹secret scanner image, e.g. a pinned gitleaks image›"
  variables:
    GIT_DEPTH: 0           # full history, so the scan sees every commit
  script:
    - "‹secret-scan command over full history›"
